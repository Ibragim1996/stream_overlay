<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlay Test</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 20px; 
            background: #0b1020; 
            color: white; 
        }
        .test-link { 
            display: block; 
            margin: 10px 0; 
            padding: 10px; 
            background: #415cff; 
            color: white; 
            text-decoration: none; 
            border-radius: 5px; 
        }
        .test-link:hover { 
            background: #3648e6; 
        }
        iframe { 
            width: 100%; 
            height: 600px; 
            border: 1px solid #333; 
            margin: 20px 0; 
        }
    </style>
</head>
<body>
    <h1>Overlay Test Page</h1>
    
    <h2>Test Links:</h2>
    <a href="http://localhost:3001/overlay" class="test-link" target="_blank">
        1. Overlay without token (should show error)
    </a>
    <a href="http://localhost:3001/overlay?t=TEST" class="test-link" target="_blank">
        2. Overlay with token (should work)
    </a>
    <a href="http://localhost:3001/overlay?t=TEST&m=funny&a=1&s=10" class="test-link" target="_blank">
        3. Overlay with full params (should work)
    </a>
    
    <h2>Embedded Test:</h2>
    <iframe src="http://localhost:3001/overlay?t=TEST" title="Overlay Test"></iframe>
    
    <h2>Console Logs:</h2>
    <div id="console-logs" style="background: #000; padding: 10px; height: 200px; overflow-y: auto; font-family: monospace; font-size: 12px;"></div>
    
    <script>
        // Capture console logs
        const originalLog = console.log;
        const originalError = console.error;
        const logDiv = document.getElementById('console-logs');
        
        function addLog(message, type = 'log') {
            const div = document.createElement('div');
            div.style.color = type === 'error' ? '#ff6b6b' : '#4ecdc4';
            div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(div);
            logDiv.scrollTop = logDiv.scrollHeight;
        }
        
        console.log = function(...args) {
            originalLog.apply(console, args);
            addLog(args.join(' '), 'log');
        };
        
        console.error = function(...args) {
            originalError.apply(console, args);
            addLog(args.join(' '), 'error');
        };
        
        // Test iframe load
        const iframe = document.querySelector('iframe');
        iframe.onload = function() {
            addLog('Iframe loaded successfully');
        };
        
        iframe.onerror = function() {
            addLog('Iframe failed to load', 'error');
        };
        
        // Test fetch
        fetch('http://localhost:3001/overlay?t=TEST')
            .then(response => {
                addLog(`Fetch response: ${response.status} ${response.statusText}`);
                return response.text();
            })
            .then(html => {
                addLog(`HTML length: ${html.length} characters`);
                if (html.includes('Application error')) {
                    addLog('❌ Found "Application error" in response', 'error');
                } else if (html.includes('Initializing overlay')) {
                    addLog('✅ Found "Initializing overlay" - looks good');
                } else if (html.includes('Missing Token')) {
                    addLog('✅ Found "Missing Token" - validation working');
                } else {
                    addLog('⚠️ Unknown response content');
                }
            })
            .catch(error => {
                addLog(`Fetch error: ${error.message}`, 'error');
            });
    </script>
</body>
</html>
