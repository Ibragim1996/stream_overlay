<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Reactions Overlay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: transparent;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        .overlay-container {
            position: relative;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .reaction-display {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px 25px;
            border-radius: 25px;
            max-width: 80%;
            text-align: center;
            font-size: 1.2em;
            font-weight: bold;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            opacity: 0;
            transform: translateX(-50%) translateY(100px);
            transition: all 0.5s ease;
            pointer-events: none;
        }

        .reaction-display.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .reaction-display.bounce {
            animation: bounceIn 0.6s ease;
        }

        @keyframes bounceIn {
            0% {
                transform: translateX(-50%) translateY(100px) scale(0.3);
                opacity: 0;
            }
            50% {
                transform: translateX(-50%) translateY(-10px) scale(1.05);
                opacity: 0.8;
            }
            70% {
                transform: translateX(-50%) translateY(5px) scale(0.95);
            }
            100% {
                transform: translateX(-50%) translateY(0) scale(1);
                opacity: 1;
            }
        }

        .style-indicator {
            display: inline-block;
            margin-right: 10px;
            font-size: 1.5em;
        }

        .tier-badge {
            position: absolute;
            top: -10px;
            right: -10px;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.7em;
            font-weight: bold;
        }

        .connection-status {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.8em;
            pointer-events: none;
        }

        .connection-status.connected {
            background: rgba(0, 184, 148, 0.8);
        }

        .connection-status.disconnected {
            background: rgba(255, 107, 107, 0.8);
        }

        .audio-controls {
            position: absolute;
            bottom: 10px;
            right: 10px;
            display: none;
        }

        .volume-slider {
            width: 100px;
            margin-left: 10px;
        }

        /* Style-specific colors */
        .reaction-display.style-support {
            border-color: rgba(0, 184, 148, 0.5);
            background: rgba(0, 184, 148, 0.1);
        }

        .reaction-display.style-light_troll {
            border-color: rgba(255, 193, 7, 0.5);
            background: rgba(255, 193, 7, 0.1);
        }

        .reaction-display.style-hard_troll {
            border-color: rgba(220, 53, 69, 0.5);
            background: rgba(220, 53, 69, 0.1);
        }
    </style>
</head>
<body>
    <div class="overlay-container">
        <div class="connection-status" id="connection-status">Connecting...</div>
        
        <div class="reaction-display" id="reaction-display">
            <span class="style-indicator" id="style-indicator">😊</span>
            <span id="reaction-text">Welcome to AI Reactions!</span>
            <div class="tier-badge" id="tier-badge">BASIC</div>
        </div>

        <div class="audio-controls" id="audio-controls">
            <button onclick="toggleMute()" id="mute-button">🔊</button>
            <input type="range" class="volume-slider" min="0" max="100" value="70" onchange="setVolume(this.value)">
        </div>
    </div>

    <script>
        let ws = null;
        let currentAudio = null;
        let isMuted = false;
        let volume = 0.7;
        let overlayKey = '';
        let cooldownActive = false;

        // Get overlay key from URL
        const urlParams = new URLSearchParams(window.location.search);
        overlayKey = urlParams.get('key');

        if (!overlayKey) {
            console.error('No overlay key provided');
            document.getElementById('connection-status').textContent = 'No key provided';
            document.getElementById('connection-status').className = 'connection-status disconnected';
        } else {
            connectWebSocket();
        }

        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws?key=${overlayKey}`;
            
            ws = new WebSocket(wsUrl);

            ws.onopen = function() {
                console.log('Connected to WebSocket');
                updateConnectionStatus('Connected', 'connected');
            };

            ws.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    handleWebSocketMessage(data);
                } catch (error) {
                    console.error('Error parsing WebSocket message:', error);
                }
            };

            ws.onclose = function() {
                console.log('WebSocket connection closed');
                updateConnectionStatus('Disconnected', 'disconnected');
                
                // Reconnect after 3 seconds
                setTimeout(() => {
                    if (!ws || ws.readyState === WebSocket.CLOSED) {
                        connectWebSocket();
                    }
                }, 3000);
            };

            ws.onerror = function(error) {
                console.error('WebSocket error:', error);
                updateConnectionStatus('Error', 'disconnected');
            };
        }

        function handleWebSocketMessage(data) {
            console.log('Received message:', data);

            switch (data.type) {
                case 'connection.established':
                    console.log('Connection established for overlay:', data.overlayKey);
                    updateConnectionStatus('Connected', 'connected');
                    break;

                case 'reaction.new':
                    handleReaction(data);
                    break;

                default:
                    console.log('Unknown message type:', data.type);
            }
        }

        function handleReaction(reaction) {
            if (cooldownActive) {
                console.log('Cooldown active, skipping reaction');
                return;
            }

            // Show reaction
            showReaction(reaction);

            // Play audio if available
            if (reaction.audioUrl && !isMuted) {
                playAudio(reaction.audioUrl);
            }

            // Start cooldown
            startCooldown(5000); // 5 seconds cooldown
        }

        function showReaction(reaction) {
            const display = document.getElementById('reaction-display');
            const text = document.getElementById('reaction-text');
            const indicator = document.getElementById('style-indicator');
            const badge = document.getElementById('tier-badge');

            // Update content
            text.textContent = reaction.text;
            badge.textContent = reaction.tier;

            // Update style indicator and colors
            const styleEmojis = {
                'support': '😊',
                'light_troll': '😏',
                'hard_troll': '😈'
            };
            indicator.textContent = styleEmojis[reaction.style] || '😊';

            // Update display class for styling
            display.className = `reaction-display style-${reaction.style} show bounce`;

            // Hide after 7 seconds
            setTimeout(() => {
                display.classList.remove('show', 'bounce');
            }, 7000);
        }

        function playAudio(audioUrl) {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }

            currentAudio = new Audio(audioUrl);
            currentAudio.volume = volume;
            
            currentAudio.onended = () => {
                currentAudio = null;
            };

            currentAudio.onerror = (error) => {
                console.error('Audio playback error:', error);
                currentAudio = null;
            };

            currentAudio.play().catch(error => {
                console.error('Failed to play audio:', error);
            });
        }

        function startCooldown(duration) {
            cooldownActive = true;
            setTimeout(() => {
                cooldownActive = false;
            }, duration);
        }

        function updateConnectionStatus(text, className) {
            const status = document.getElementById('connection-status');
            status.textContent = text;
            status.className = `connection-status ${className}`;
        }

        function toggleMute() {
            isMuted = !isMuted;
            const button = document.getElementById('mute-button');
            button.textContent = isMuted ? '🔇' : '🔊';
            
            if (currentAudio) {
                currentAudio.volume = isMuted ? 0 : volume;
            }
        }

        function setVolume(value) {
            volume = value / 100;
            if (currentAudio) {
                currentAudio.volume = isMuted ? 0 : volume;
            }
        }

        // Show welcome message
        setTimeout(() => {
            showReaction({
                text: 'AI Reactions Overlay Ready! 🎤',
                style: 'support',
                tier: 'BASIC'
            });
        }, 1000);
    </script>
</body>
</html>
