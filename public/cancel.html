<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Cancelled - AI Reactions</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 40px;
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        .cancel-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        h1 {
            color: #2d3436;
            margin-bottom: 15px;
            font-size: 2em;
        }

        p {
            color: #636e72;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .back-button {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .back-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255,107,107,0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="cancel-icon">❌</div>
        <h1>Payment Cancelled</h1>
        <p>Your payment was cancelled. No charges have been made to your account.</p>
        <p>You can try again anytime to send an AI reaction to the streamer.</p>
        
        <a href="javascript:history.back()" class="back-button">
            Try Again
        </a>
    </div>

    <script>
        // Auto-redirect after 10 seconds
        setTimeout(() => {
            if (history.length > 1) {
                history.back();
            } else {
                window.location.href = '/';
            }
        }, 10000);
    </script>
</body>
</html>
